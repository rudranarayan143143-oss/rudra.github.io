<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Letter Portrait</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

#typingText{
    position:absolute;
    top:30px;
    width:100%;
    text-align:center;
    color:#fff;
    font-size:28px;
    letter-spacing:2px;
    z-index:10;
    text-shadow:0 0 15px orange;
}

</style>
</head>
<body>

<div id="typingText"></div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const description =
"A cinematic portrait of a man wearing sunglasses in darkness, illuminated only by the warm glow of a lighter flame reflecting beautifully in his glasses.";

const typingText = document.getElementById("typingText");

let charIndex = 0;

function typeWriter(){

    if(charIndex < description.length){

        typingText.innerHTML += description.charAt(charIndex);

        charIndex++;

        setTimeout(typeWriter,40);

    }else{

        setTimeout(createTextPortrait,1200);

    }

}

typeWriter();

const img = new Image();

img.src = "gemini_generated_image_eoreeseoreeseore.png";

function createTextPortrait(){

    const tempCanvas = document.createElement("canvas");
    const tempCtx = tempCanvas.getContext("2d");

    const imgWidth = 450;
    const imgHeight = 600;

    tempCanvas.width = imgWidth;
    tempCanvas.height = imgHeight;

    tempCtx.drawImage(img,0,0,imgWidth,imgHeight);

    const pixels =
    tempCtx.getImageData(0,0,imgWidth,imgHeight).data;

    let particles = [];

    for(let y=0; y<imgHeight; y+=6){

        for(let x=0; x<imgWidth; x+=6){

            const index = (y * imgWidth + x) * 4;

            const r = pixels[index];
            const g = pixels[index+1];
            const b = pixels[index+2];

            const brightness = (r+g+b)/3;

            if(brightness > 35){

                const randomLetter =
                description[Math.floor(Math.random()*description.length)];

                particles.push({

                    x:Math.random()*canvas.width,
                    y:Math.random()*canvas.height,

                    targetX:
                    x + canvas.width/2 - imgWidth/2,

                    targetY:
                    y + canvas.height/2 - imgHeight/2,

                    letter:randomLetter,

                    color:`rgb(${r},${g},${b})`,

                    size:10 + brightness/40

                });

            }

        }

    }

    animateParticles(particles);

}

function animateParticles(particles){

    function animate(){

        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        particles.forEach(p=>{

            p.x += (p.targetX - p.x)*0.05;
            p.y += (p.targetY - p.y)*0.05;

            ctx.fillStyle = p.color;

            ctx.font = p.size + "px Arial";

            ctx.fillText(p.letter,p.x,p.y);

        });

        requestAnimationFrame(animate);

    }

    animate();

}

window.addEventListener("resize",()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

</script>

</body>
</html>
